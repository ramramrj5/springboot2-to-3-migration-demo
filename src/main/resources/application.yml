spring:
  datasource:
    url: jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: true
        format_sql: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: "change-me-this-must-be-at-least-256-bits-long-for-hs256-ok"
    expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate.stat: INFO
